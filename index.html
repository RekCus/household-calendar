<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Household Calendar</title>
<meta name="theme-color" content="#2b5f8c">
<meta name="description" content="Household calendar with work schedules, tasks and trash days">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Household">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#17262b;--mute:#66767b;--line:#dbe3df;--acc:#2b5f8c;--accfg:#fff;--warn:#b4531a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181b;--card:#182327;--ink:#e8efec;--mute:#93a4a8;--line:#2a3a3f;--acc:#6fa8dc;--accfg:#0d1a20;--warn:#f0a06a}}
:root[data-theme="dark"]{--bg:#10181b;--card:#182327;--ink:#e8efec;--mute:#93a4a8;--line:#2a3a3f;--acc:#6fa8dc;--accfg:#0d1a20;--warn:#f0a06a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 "DM Sans",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h1,h2{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:500}
button.d{color:var(--warn)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.ctl{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0}
.top h1{font-size:19px;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw{position:relative}
#pf{display:flex;align-items:center;max-width:110px;min-width:0;flex:0 1 auto;overflow:hidden;white-space:nowrap}
.mw{flex:0 0 auto}
.ib{display:flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;flex:0 0 auto}
.ib[hidden]{display:none}
.ib svg{width:19px;height:19px}
.ib.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ib.spin svg{animation:none}}
#dd{position:absolute;right:0;top:calc(100% + 6px);min-width:200px;width:max-content;max-width:calc(100vw - 28px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:15;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#dd[hidden]{display:none}
#dd button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px}
#dd button:hover{background:var(--bg)}
.top select{width:auto;padding:8px}
.nav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.nav h2{flex:1;font-size:19px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:12px;color:var(--mute);padding:2px 0}
.c{min-height:62px;border-radius:10px;background:var(--card);border:1px solid var(--line);padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;font-size:14px}
.c.o{background:none;border-color:transparent;cursor:default}
.c{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#m.on .sheet{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){#m.on .sheet{animation:none}}
.c.t b{color:var(--acc)}
.c.tr{border-color:transparent}
.c.tr b{color:inherit}
.c.t.tr b{text-decoration:underline}
.c.tr .dots i{box-shadow:0 0 0 1px #fff}
.c.s{border:2px solid var(--acc)}
.c.tr.s{border-color:var(--ink)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:8px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.tt{font-size:9px;line-height:10px;min-height:10px;font-weight:700}
.bar .now{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:#e5484d;border-radius:1px;z-index:3;pointer-events:none}
.bar .now::before{content:"";position:absolute;top:-3px;left:-2px;width:6px;height:6px;border-radius:50%;background:#e5484d}
.bar .dl{position:absolute;top:-3px;bottom:-3px;width:4px;margin-left:-2px;border-radius:2px;border:1px solid var(--card)}
.wk{display:flex;flex-direction:column;gap:2px;width:100%}
.wk i{display:block;height:11px;border-radius:3px;font:700 8px/11px "DM Sans",sans-serif;font-style:normal;text-align:center;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.55)}
.wk i.off{opacity:.18}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin-top:8px;align-items:center}
.lg i{display:inline-block;vertical-align:middle;margin-right:5px}
.panel{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ph h2{flex:1;font-size:18px;text-transform:capitalize}
.sub{font-size:13px;color:var(--mute);margin:12px 0 6px;font-weight:700}
.rib{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.rib span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:22px;border-radius:6px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/4 - 1px),var(--line) calc(100%/4 - 1px) calc(100%/4));border:1px solid var(--line)}
.bar .w{position:absolute;top:0;bottom:0;border-radius:5px;opacity:.35}
.bar .k{position:absolute;top:3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--card)}
.ax{display:grid;grid-template-columns:64px 1fr;gap:8px;font-size:11px;color:var(--mute)}
.ax div{display:flex;justify-content:space-between}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--acc)}
.task .b{flex:1;cursor:pointer}
.task.dn .ti{text-decoration:line-through;color:var(--mute)}
.meta{font-size:12.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.warn{color:var(--warn)}
.empty{color:var(--mute);padding:8px 0}
#m{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#m.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow-y:auto;overflow-x:hidden;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:19px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input[type=text],input[type=date],input[type=time],input[type=number],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.hr{display:grid;grid-template-columns:72px 24px 1fr 1fr;gap:6px;align-items:center;margin:5px 0}
.hr small{display:block;font-size:11px;color:var(--mute)}
.hr input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
#toasts{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;max-width:520px;width:100%;margin:0 auto;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.22);display:flex;gap:10px;align-items:flex-start;animation:dn .22s ease-out}
.toast div{flex:1;min-width:0}
.toast b{display:block}
.toast span{font-size:13px;color:var(--mute)}
.toast button{padding:4px 8px}
@keyframes dn{from{transform:translateY(-120%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.row>*,.hr>*{min-width:0}
.sheet input,.sheet select{min-width:0;max-width:100%}
.acts .sp{flex:1}
.mem{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.mem span{flex:1}
</style>

function dirty(){return snapStr()!==(SY.base||EMPTY)}
function updSync(){var b=$('#up');if(!b)return;b.hidden=!(dirty()&&(isAdmin()||!!mem(ME)))}
var RX_ID=/^[A-Za-z0-9_-]{1,40}$/,RX_D=/^\d{4}-\d{2}-\d{2}$/,RX_T=/^\d{2}:\d{2}$/,RX_C=/^#[0-9a-fA-F]{6}$/;
function sid(v){return typeof v==='string'&&RX_ID.test(v)?v:null}
function sd(v){return typeof v==='string'&&RX_D.test(v)&&!isNaN(parse(v))?v:null}
function stm(v){return typeof v==='string'&&RX_T.test(v)&&+v.slice(0,2)<25&&+v.slice(3)<60?v:null}
function sn(v,a,b,d){v=parseInt(v);return isNaN(v)?d:Math.max(a,Math.min(b,v))}
function ss(v,n){return typeof v==='string'?v.slice(0,n):''}
function sh(v){return typeof v==='string'&&/^-?\d{1,12}$/.test(v)?v:''}
function clean(d){
 if(!d||typeof d!=='object'||!Array.isArray(d.members)||!Array.isArray(d.tasks))return null;
 var ids=Object.create(null),o={members:[],tasks:[],trash:[],pin:sh(d.pin)};
 d.members.slice(0,50).forEach(function(m){
  if(!m||typeof m!=='object')return;var id=sid(m.id),an=sd(m.anchor),len=sn(m.len,1,60,7);if(!id||!an||ids[id])return;ids[id]=1;
  var hh=[];for(var i=0;i<len;i++){var w=m.hours&&m.hours[i];hh.push(Array.isArray(w)&&stm(w[0])&&stm(w[1])?[w[0],w[1],ss(w[2],40)]:null)}
  var off=[];(Array.isArray(m.off)?m.off:[]).slice(0,400).forEach(function(x){if(x&&sid(x.id)&&sd(x.from)&&sd(x.to)&&(x.type==='Vacation'||x.type==='Day off'))off.push({id:x.id,type:x.type,from:x.from,to:x.to})});
  o.members.push({id:id,name:ss(m.name,60)||'?',color:RX_C.test(m.color)?m.color:'#2b8c6e',len:len,anchor:an,hours:hh,unemployed:!!m.unemployed,pin:sh(m.pin),off:off})});
 d.tasks.slice(0,5000).forEach(function(t){
  if(!t||typeof t!=='object')return;var id=sid(t.id),dt=sd(t.date);if(!id||!dt)return;
  var dn={};if(t.done&&typeof t.done==='object')Object.keys(t.done).slice(0,800).forEach(function(k){if(RX_D.test(k)&&t.done[k])dn[k]=true});
  o.tasks.push({id:id,title:ss(t.title,200),date:dt,time:t.time?(stm(t.time)||''):'',dur:sn(t.dur,0,1440,0),who:ids[t.who]?t.who:'',type:TYPES.indexOf(t.type)>-1?t.type:'Other',repeat:['none','daily','weekly'].indexOf(t.repeat)>-1?t.repeat:'none',done:dn})});
 (Array.isArray(d.trash)?d.trash:[]).slice(0,30).forEach(function(z){
  if(!z||typeof z!=='object')return;var id=sid(z.id),st=sd(z.start);if(!id||!st)return;
  var dl=function(a){return(Array.isArray(a)?a:[]).filter(function(x){return sd(x)}).slice(0,800)};
  o.trash.push({id:id,name:ss(z.name,60)||'?',color:RX_C.test(z.color)?z.color:'#8a8f8c',start:st,weeks:sn(z.weeks,0,12,0),time:z.time?(stm(z.time)||''):'',extra:dl(z.extra),skip:dl(z.skip)})});
 return o}
function adopt(o,fsha,csha){S.members=o.members;S.tasks=o.tasks;S.trash=o.trash;S.pin=o.pin;save();if(fsha!==undefined){SY={base:snapStr(),fileSha:fsha,commit:csha,at:Date.now()};saveSY();updSync()}}
function confirmM(title,msg,ok,yes,no){openM('<h2>'+esc(title)+'</h2><div class="empty">'+esc(msg)+'</div><div class="acts"><span class="sp"></span><button id="cfn">'+L('Cancel')+'</button><button class="p" id="cfk">'+esc(ok)+'</button></div>');$('#cfn').onclick=function(){closeM();if(no)no()};$('#cfk').onclick=function(){closeM();yes()}}
function ask(t,m,ok){return new Promise(function(res){confirmM(t,m,ok,function(){res(true)},function(){res(false)})})}
function exportJSON(){var o=snap();o.exportedAt=new Date().toISOString();var u=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)+'\n'],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='data.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000);toast(L('Data exported.'),'data.json')}
function importJSON(){
 if(!isAdmin()){denied();return}
 var f=document.createElement('input');f.type='file';f.accept='.json,application/json';
 f.onchange=function(){var fl=f.files[0];if(!fl)return;var r=new FileReader();
  r.onload=function(){var d;try{d=JSON.parse(r.result)}catch(e){}var c=clean(d);
   if(!c){toast(L('Import failed'),L('That file is not valid data.json for this app.'));return}
   confirmM(L('Replace current data?'),L('This file contains')+' '+c.members.length+' '+L('members')+', '+c.tasks.length+' '+L('tasks')+', '+c.trash.length+' '+L('trash types')+'.',L('Replace'),function(){adopt(c);render();toast(L('Data imported.'),'')})};
  r.readAsText(fl)};
 f.click()}
function ghOK(){return !!GH.repo&&/^[\w.-]+\/[\w.-]+$/.test(GH.repo)}
function ghFetch(path,opt){opt=opt||{};var h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(GH.token)h.Authorization='Bearer '+GH.token;if(opt.body)h['Content-Type']='application/json';
 return fetch('https://api.github.com/repos/'+GH.repo+path,{method:opt.method||'GET',headers:h,body:opt.body}).then(function(r){if(r.ok)return r.json();var e=new Error('http');e.status=r.status;throw e})}
function ghErr(e){var s=e&&e.status;return s===401?L('Token rejected by GitHub.'):s===403?L('No permission: the token needs Contents read and write access.'):s===404?L('Repository, branch main or data.json not found.'):s?L('GitHub error')+' ('+s+')':L('Could not reach GitHub.')}
function b64(str){var b=new TextEncoder().encode(str),s='';for(var i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)}
function unb64(s){var t=atob(s.replace(/\s/g,'')),b=new Uint8Array(t.length);for(var i=0;i<t.length;i++)b[i]=t.charCodeAt(i);return new TextDecoder().decode(b)}
function busy(b,on){b.classList.toggle('spin',on);b.disabled=on}
async function pullGH(){
 var b=$('#upd');
 if(!ghOK()){if(isAdmin())dataM();else toast(L('Sync failed'),L('Sync is not set up. Ask the admin to add the repository.'));return}
 if(b.disabled)return;busy(b,true);
 try{
  var c=await ghFetch('/commits/main?t='+Date.now());
  if(c.sha===SY.commit){toast(L('Already up to date'),'');return}
  var f=await ghFetch('/contents/data.json?ref=main&t='+Date.now());
  if(f.sha===SY.fileSha){SY.commit=c.sha;saveSY();toast(L('Already up to date'),'');return}
  var d;try{if(f.encoding==='base64'&&f.content)d=JSON.parse(unb64(f.content))}catch(e){}
  var o=clean(d);if(!o){toast(L('Sync failed'),L('That file is not valid data.json for this app.'));return}
  if(dirty()){busy(b,false);var ok=await ask(L('Check for updates'),L('Local changes that are not uploaded will be replaced by the repository version. Continue?'),L('Continue'));if(!ok)return;busy(b,true)}
  adopt(o,f.sha,c.sha);
  try{sessionStorage.setItem('hh-keep',ME)}catch(e){}
  toast(L('Updated'),L('Reloading…'));setTimeout(function(){location.reload()},700);
 }catch(e){toast(L('Sync failed'),ghErr(e))}finally{busy(b,false)}
}
async function pushGH(){
 var b=$('#up');
 if(!ghOK()||!GH.token){if(isAdmin())dataM();else toast(L('Sync failed'),L('Sync is not set up. Ask the admin to add the repository.'));return}
 if(b.disabled)return;busy(b,true);
 try{
  var f=null;try{f=await ghFetch('/contents/data.json?ref=main&t='+Date.now())}catch(e){if(e.status!==404)throw e}
  if(f&&f.sha!==SY.fileSha){busy(b,false);var ok=await ask(L('Overwrite'),L('The repository has newer changes. Overwrite them with your version?'),L('Overwrite'));if(!ok)return;busy(b,true)}
  var body={message:'Update data.json (Household Calendar)',content:b64(fileStr()),branch:'main'};if(f)body.sha=f.sha;
  var r=await ghFetch('/contents/data.json',{method:'PUT',body:JSON.stringify(body)});
  SY={base:snapStr(),fileSha:r.content.sha,commit:r.commit.sha,at:Date.now()};saveSY();updSync();
  toast(L('Uploaded'),L('Your changes are on GitHub.'));
 }catch(e){toast(L('Sync failed'),ghErr(e))}finally{busy(b,false)}
}
function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall=null;buildMenu()}}
function dataM(){
 var ad=isAdmin(),ok=ghOK(),h='<h2>'+L('Data & sync')+'</h2><div class="sub">'+L('Backup')+'</div><div class="row"><button id="dxp">'+L('Export data.json')+'</button><button id="dim"'+(ad?'':' disabled')+'>'+L('Import data.json')+'</button></div>'+(ad?'':'<div class="meta" style="margin-top:6px">'+L('Only the admin can import data.')+'</div>')+'<div class="sub">'+L('GitHub sync')+'</div>';
 if(ad)h+='<label>'+L('Repository (owner/name)')+'</label><input type="text" id="gr" value="'+esc(GH.repo||'')+'" placeholder="owner/repository" autocapitalize="off" autocorrect="off" spellcheck="false"><label>'+L('Access token')+'</label><input type="password" id="gt" autocomplete="off" placeholder="'+(GH.token?'\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022':'github_pat_...')+'"><div class="meta warn" id="ge" style="margin-top:6px"></div>';
 else h+='<div class="meta">'+(ok?L('Connected to')+' '+esc(GH.repo):L('Not set up'))+'. '+L('Only the admin can change the sync settings.')+'</div>';
 h+='<div class="meta" style="margin-top:8px">'+L('Branch: main. File: data.json. Use a private repository: data.json contains names and PIN codes. The token stays on this device and is never written to data.json.')+'</div><div class="meta" style="margin-top:4px">'+L('Last synced')+': '+(SY.at?new Date(SY.at).toLocaleString(loc()):L('Never'))+'</div>';
 h+='<div class="acts">'+(ad&&ok?'<button class="d" id="gd">'+L('Disconnect')+'</button>':'')+'<span class="sp"></span><button id="cl">'+L('Done')+'</button>'+(ad?'<button class="p" id="gs">'+L('Save')+'</button>':'')+'</div>';
 openM(h);
 $('#dxp').onclick=exportJSON;$('#dim').onclick=importJSON;
 if(ad){
  $('#gs').onclick=function(){var r=$('#gr').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,''),t=$('#gt').value.trim();
   if(!/^[\w.-]+\/[\w.-]+$/.test(r)){$('#ge').textContent=L('Use the format owner/name.');return}
   if(GH.repo!==r){SY.commit='';SY.fileSha='';saveSY()}
   GH.repo=r;if(t)GH.token=t;saveGH();closeM();toast(L('Saved'),r)};
  if(ok)$('#gd').onclick=function(){GH={};saveGH();SY.commit='';SY.fileSha='';saveSY();dataM()};
 }
}
$('#upd').onclick=pullGH;$('#up').onclick=pushGH;
setInterval(checkNotif,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkNotif()});
if(ME!=='admin'&&ME!=='guest'&&!mem(ME))ME='guest';

setTimeout(checkNotif,500);
statics();render();
</script>
